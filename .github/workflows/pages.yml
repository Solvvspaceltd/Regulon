# Builds the site as static files and publishes it to GitHub Pages
# on every push to main. Can also be run by hand from the Actions tab.
#
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables →
#   WAITLIST_URL = your sign-up webhook URL (see README, "Sign-up form").

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Pages serves static files only, so the server-side sign-up route
      # is left out of this build. The form posts to WAITLIST_URL instead.
      - name: Remove server-only routes
        run: rm -rf src/app/api

      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          NEXT_PUBLIC_STATIC_SITE: "true"
          # "/Regulon" on github.io; empty once a custom domain is set.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_WAITLIST_URL: ${{ vars.WAITLIST_URL }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
